services:
  postgres:
    image: postgres:16-alpine
    container_name: asanop-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: asanop
      POSTGRES_PASSWORD: asanop
      POSTGRES_DB: asanop
    volumes:
      - asanop_pg_data:/var/lib/postgresql/data

volumes:
  asanop_pg_data:
