# Asanop API on Render (Blueprint)
# Dashboard → New → Blueprint → connect this repo → apply.
# Or create a Web Service manually using the same build/start commands.

services:
  - type: web
    name: asanop-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run prisma:generate -w @asanop/api && npm exec -w @asanop/api -- prisma migrate deploy && npm run prisma:seed:deploy -w @asanop/api && npm run build -w @asanop/api
    startCommand: npm run start:prod -w @asanop/api
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      # One worker fits the free instance. Raise only after measuring memory and
      # moving attachments to shared object storage.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: asanop-db
          property: connectionString

databases:
  - name: asanop-db
    plan: free
    databaseName: asanop
    user: asanop
